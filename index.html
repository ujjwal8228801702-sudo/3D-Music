<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>3D Music - Immersive Ad-Free Player</title>

    <!-- Custom Embedded 3D Music Logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%2309090b'/%3E%3Cpolygon points='256,120 365,183 256,246 147,183' fill='%23a855f7'/%3E%3Cpolygon points='147,183 256,246 256,372 147,309' fill='%236366f1'/%3E%3Cpolygon points='365,183 256,246 256,372 365,309' fill='%2306b6d4'/%3E%3Crect x='224' y='230' width='12' height='52' rx='6' fill='%23fff'/%3E%3Crect x='250' y='210' width='12' height='92' rx='6' fill='%23fff'/%3E%3Crect x='276' y='238' width='12' height='40' rx='6' fill='%23fff'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1a103c, #09090b 60%, #0f172a);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .disc-container {
            perspective: 1000px;
        }
        .vinyl-disc {
            transition: transform 0.2s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }
        .spinning {
            animation: spin 12s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .neon-active {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6), inset 0 0 10px rgba(139, 92, 246, 0.4);
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.2);
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 5px;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 10px #a855f7;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4">

    <div class="glass-panel w-full max-w-md rounded-3xl p-6 relative overflow-hidden">
        <!-- Ambient Background Orbs -->
        <div class="absolute -top-20 -left-20 w-48 h-48 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-48 h-48 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header with Custom 3D Logo -->
        <div class="flex justify-between items-center mb-6 relative z-10">
            <div class="flex items-center gap-2.5">
                <svg class="w-10 h-10 rounded-xl shadow-lg shadow-purple-500/30" viewBox="0 0 512 512">
                    <defs>
                        <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#1e1b4b"/>
                            <stop offset="100%" stop-color="#09090b"/>
                        </linearGradient>
                    </defs>
                    <rect width="512" height="512" rx="115" fill="url(#logoGrad)"/>
                    <polygon points="256,115 370,180 256,245 142,180" fill="#a855f7"/>
                    <polygon points="142,180 256,245 256,375 142,310" fill="#6366f1"/>
                    <polygon points="370,180 256,245 256,375 370,310" fill="#06b6d4"/>
                    <rect x="224" y="230" width="12" height="52" rx="6" fill="#ffffff"/>
                    <rect x="250" y="210" width="12" height="92" rx="6" fill="#ffffff"/>
                    <rect x="276" y="238" width="12" height="40" rx="6" fill="#ffffff"/>
                </svg>
                <div>
                    <span class="font-extrabold text-xl tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-cyan-300 block leading-none">3D Music</span>
                    <span class="text-[10px] text-zinc-400 tracking-wider">SPATIAL SOUND</span>
                </div>
            </div>
            <span class="text-[11px] uppercase tracking-widest px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-semibold">
                <i class="fa-solid fa-shield-halved mr-1"></i>Ad-Free
            </span>
        </div>

        <!-- 3D Disc & Visualizer Area -->
        <div class="relative flex flex-col items-center justify-center my-4 disc-container z-10" id="tiltArea">
            <canvas id="visualizer" width="260" height="260" class="absolute pointer-events-none opacity-80"></canvas>
            
            <div id="discWrapper" class="vinyl-disc w-44 h-44 rounded-full p-1.5 bg-gradient-to-tr from-purple-500 via-pink-500 to-cyan-400 shadow-2xl shadow-purple-900/50 relative flex items-center justify-center">
                <div id="discSpin" class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center relative overflow-hidden spinning paused">
                    <div class="absolute inset-2 rounded-full border border-white/10"></div>
                    <div class="absolute inset-5 rounded-full border border-white/10"></div>
                    <div class="absolute inset-8 rounded-full border border-white/10"></div>
                    <div class="w-16 h-16 rounded-full bg-zinc-950 flex items-center justify-center border-2 border-purple-400/50 z-10 shadow-inner">
                        <svg class="w-10 h-10" viewBox="0 0 512 512">
                            <polygon points="256,115 370,180 256,245 142,180" fill="#a855f7"/>
                            <polygon points="142,180 256,245 256,375 142,310" fill="#6366f1"/>
                            <polygon points="370,180 256,245 256,375 370,310" fill="#06b6d4"/>
                            <rect x="224" y="230" width="12" height="52" rx="6" fill="#ffffff"/>
                            <rect x="250" y="210" width="12" height="92" rx="6" fill="#ffffff"/>
                            <rect x="276" y="238" width="12" height="40" rx="6" fill="#ffffff"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Song Info -->
        <div class="text-center mt-6 mb-4 relative z-10">
            <h2 id="songTitle" class="text-lg font-bold truncate px-2">अपना गाना चुनें या स्ट्रीम चलाएं</h2>
            <p id="songArtist" class="text-xs text-zinc-400 mt-1">3D Surround Engine Ready</p>
        </div>

        <!-- Progress Bar -->
        <div class="mb-5 relative z-10">
            <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full cursor-pointer">
            <div class="flex justify-between text-[11px] text-zinc-400 mt-1.5 font-mono">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <!-- 3D & Bass Controls -->
        <div class="grid grid-cols-2 gap-3 mb-6 relative z-10">
            <button id="btn3D" onclick="toggle3D()" class="py-2.5 px-3 rounded-2xl border border-white/10 bg-white/5 text-xs font-semibold flex items-center justify-center gap-2 transition-all hover:bg-white/10">
                <i class="fa-solid fa-vr-cardboard text-purple-400"></i>
                <span>3D Surround: <b id="status3D">OFF</b></span>
            </button>
            <button id="btnBass" onclick="toggleBass()" class="py-2.5 px-3 rounded-2xl border border-white/10 bg-white/5 text-xs font-semibold flex items-center justify-center gap-2 transition-all hover:bg-white/10">
                <i class="fa-solid fa-wave-square text-cyan-400"></i>
                <span>Extra Bass: <b id="statusBass">OFF</b></span>
            </button>
        </div>

        <!-- Main Playback Controls -->
        <div class="flex items-center justify-center gap-6 mb-6 relative z-10">
            <button onclick="prevTrack()" class="w-11 h-11 rounded-full bg-white/5 hover:bg-white/15 flex items-center justify-center text-zinc-300 transition">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="playPauseBtn" onclick="togglePlay()" class="w-16 h-16 rounded-full bg-gradient-to-tr from-purple-600 to-cyan-500 text-white text-xl flex items-center justify-center shadow-lg shadow-purple-600/40 hover:scale-105 active:scale-95 transition">
                <i id="playIcon" class="fa-solid fa-play ml-1"></i>
            </button>
            <button onclick="nextTrack()" class="w-11 h-11 rounded-full bg-white/5 hover:bg-white/15 flex items-center justify-center text-zinc-300 transition">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <!-- Local File Upload & Playlist -->
        <div class="border-t border-white/10 pt-4 relative z-10">
            <div class="flex justify-between items-center mb-3">
                <span class="text-xs font-semibold text-zinc-300 uppercase tracking-wider">प्लेलिस्ट और लोकल गाने</span>
                <label class="cursor-pointer text-xs bg-purple-600/30 hover:bg-purple-600/50 text-purple-200 border border-purple-500/40 px-3 py-1.5 rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-folder-plus"></i> फोन से MP3 चुनें
                    <input type="file" id="fileInput" accept="audio/*" multiple class="hidden" onchange="handleFiles(this.files)">
                </label>
            </div>
            
            <div id="playlist" class="max-h-36 overflow-y-auto space-y-1.5 pr-1 text-sm"></div>
        </div>
    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');
        const discSpin = document.getElementById('discSpin');
        const progressBar = document.getElementById('progressBar');
        const playlistEl = document.getElementById('playlist');
        
        let tracks = [
            { name: "Lo-Fi Chill Beats (Ad-Free Radio)", artist: "3D Ambient Stream", url: "https://streams.ilovemusic.de/iloveradio17.mp3" },
            { name: "Bollywood & Classic Vibes", artist: "Live Ad-Free Stream", url: "https://stream.zeno.fm/0r0xa792kwzuv" },
            { name: "Deep Focus & Synthwave", artist: "3D Spatial Audio", url: "https://streams.ilovemusic.de/iloveradio2.mp3" }
        ];
        let currentIndex = 0;

        let audioCtx, source, panner, bassFilter, analyser;
        let is3DActive = false;
        let isBassActive = false;
        let panAngle = 0;

        function initAudioContext() {
            if (audioCtx) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            source = audioCtx.createMediaElementSource(audio);
            panner = audioCtx.createStereoPanner();
            bassFilter = audioCtx.createBiquadFilter();
            bassFilter.type = "lowshelf";
            bassFilter.frequency.value = 150;
            bassFilter.gain.value = 0;
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64;

            source.connect(bassFilter);
            bassFilter.connect(panner);
            panner.connect(analyser);
            analyser.connect(audioCtx.destination);
            animate3DAndVisualizer();
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            tracks.forEach((track, idx) => {
                const active = idx === currentIndex;
                const div = document.createElement('div');
                div.className = `p-2.5 rounded-xl flex items-center justify-between cursor-pointer transition ${active ? 'bg-purple-600/30 border border-purple-500/40 text-white' : 'bg-white/5 hover:bg-white/10 text-zinc-300'}`;
                div.onclick = () => loadAndPlay(idx);
                div.innerHTML = `
                    <div class="truncate pr-2">
                        <div class="font-medium text-xs truncate">${track.name}</div>
                        <div class="text-[10px] text-zinc-400">${track.artist}</div>
                    </div>
                    <i class="fa-solid ${active && !audio.paused ? 'fa-volume-high text-purple-400' : 'fa-play text-xs opacity-60'}"></i>
                `;
                playlistEl.appendChild(div);
            });
        }

        function loadAndPlay(index) {
            initAudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            currentIndex = index;
            const track = tracks[currentIndex];
            audio.src = track.url;
            document.getElementById('songTitle').innerText = track.name;
            document.getElementById('songArtist').innerText = track.artist;
            audio.play().then(() => {
                updatePlayState(true);
                renderPlaylist();
            }).catch(e => console.log("Playback error:", e));
        }

        function togglePlay() {
            initAudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (!audio.src) {
                loadAndPlay(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                updatePlayState(true);
            } else {
                audio.pause();
                updatePlayState(false);
            }
            renderPlaylist();
        }

        function updatePlayState(isPlaying) {
            if (isPlaying) {
                playIcon.classList.replace('fa-play', 'fa-pause');
                playIcon.classList.remove('ml-1');
                discSpin.classList.remove('paused');
            } else {
                playIcon.classList.replace('fa-pause', 'fa-play');
                playIcon.classList.add('ml-1');
                discSpin.classList.add('paused');
            }
        }

        function nextTrack() {
            currentIndex = (currentIndex + 1) % tracks.length;
            loadAndPlay(currentIndex);
        }

        function prevTrack() {
            currentIndex = (currentIndex - 1 + tracks.length) % tracks.length;
            loadAndPlay(currentIndex);
        }

        function handleFiles(files) {
            if (!files.length) return;
            const startIdx = tracks.length;
            Array.from(files).forEach(file => {
                const url = URL.createObjectURL(file);
                tracks.push({
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    artist: "Local Device Audio",
                    url: url
                });
            });
            loadAndPlay(startIdx);
        }

        function toggle3D() {
            initAudioContext();
            is3DActive = !is3DActive;
            const btn = document.getElementById('btn3D');
            document.getElementById('status3D').innerText = is3DActive ? 'ON' : 'OFF';
            btn.classList.toggle('neon-active', is3DActive);
            if (!is3DActive && panner) panner.pan.value = 0;
        }

        function toggleBass() {
            initAudioContext();
            isBassActive = !isBassActive;
            const btn = document.getElementById('btnBass');
            document.getElementById('statusBass').innerText = isBassActive ? 'ON' : 'OFF';
            btn.classList.toggle('neon-active', isBassActive);
            if (bassFilter) bassFilter.gain.value = isBassActive ? 14 : 0;
        }

        audio.addEventListener('timeupdate', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                progressBar.value = (audio.currentTime / audio.duration) * 100;
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('durationTime').innerText = formatTime(audio.duration);
            }
        });

        progressBar.addEventListener('input', () => {
            if (audio.duration && !isNaN(audio.duration)) {
                audio.currentTime = (progressBar.value / 100) * audio.duration;
            }
        });

        audio.addEventListener('ended', nextTrack);

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        const tiltArea = document.getElementById('tiltArea');
        const discWrapper = document.getElementById('discWrapper');
        tiltArea.addEventListener('mousemove', (e) => {
            const rect = tiltArea.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width - 0.5;
            const y = (e.clientY - rect.top) / rect.height - 0.5;
            discWrapper.style.transform = `rotateY(${x * 35}deg) rotateX(${-y * 35}deg)`;
        });
        tiltArea.addEventListener('mouseleave', () => {
            discWrapper.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        function animate3DAndVisualizer() {
            const canvas = document.getElementById('visualizer');
            const ctx = canvas.getContext('2d');
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                requestAnimationFrame(draw);

                if (is3DActive && !audio.paused && panner) {
                    panAngle += 0.025;
                    panner.pan.value = Math.sin(panAngle);
                }

                analyser.getByteFrequencyData(dataArray);
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = 92;

                for (let i = 0; i < bufferLength; i++) {
                    const barHeight = dataArray[i] * 0.22;
                    const angle = (i * 2 * Math.PI) / bufferLength;
                    const x1 = centerX + Math.cos(angle) * radius;
                    const y1 = centerY + Math.sin(angle) * radius;
                    const x2 = centerX + Math.cos(angle) * (radius + barHeight);
                    const y2 = centerY + Math.sin(angle) * (radius + barHeight);

                    ctx.strokeStyle = i % 2 === 0 ? '#a855f7' : '#22d3ee';
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.beginPath();
                    ctx.moveTo(x1, y1);
                    ctx.lineTo(x2, y2);
                    ctx.stroke();
                }
            }
            draw();
        }

        renderPlaylist();
    </script>
</body>
</html>
