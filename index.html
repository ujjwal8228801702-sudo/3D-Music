<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>3D Music - Online Ad-Free Spatial Player</title>

    <!-- Custom Embedded 3D Music Logo -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='115' fill='%2309090b'/%3E%3Cpolygon points='256,120 365,183 256,246 147,183' fill='%23a855f7'/%3E%3Cpolygon points='147,183 256,246 256,372 147,309' fill='%236366f1'/%3E%3Cpolygon points='365,183 256,246 256,372 365,309' fill='%2306b6d4'/%3E%3Crect x='224' y='230' width='12' height='52' rx='6' fill='%23fff'/%3E%3Crect x='250' y='210' width='12' height='92' rx='6' fill='%23fff'/%3E%3Crect x='276' y='238' width='12' height='40' rx='6' fill='%23fff'/%3E%3C/svg%3E">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
        
        body {
            font-family: 'Outfit', sans-serif;
            background: radial-gradient(circle at top left, #1a103c, #09090b 60%, #0f172a);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
            user-select: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .disc-container {
            perspective: 1000px;
        }
        .vinyl-disc {
            transition: transform 0.2s ease-out, box-shadow 0.3s ease;
            transform-style: preserve-3d;
        }
        .spinning {
            animation: spin 12s linear infinite;
        }
        .paused {
            animation-play-state: paused;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .neon-active {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6), inset 0 0 10px rgba(139, 92, 246, 0.4);
            border-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.2);
        }

        input[type="range"] {
            -webkit-appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 5px;
            border-radius: 5px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #a855f7;
            cursor: pointer;
            box-shadow: 0 0 10px #a855f7;
        }

        /* Hide scrollbar for category chips */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex items-center justify-center p-3 sm:p-4">

    <div class="glass-panel w-full max-w-md rounded-3xl p-5 relative overflow-hidden">
        <!-- Ambient Orbs -->
        <div class="absolute -top-20 -left-20 w-48 h-48 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>
        <div class="absolute -bottom-20 -right-20 w-48 h-48 bg-cyan-500/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Header -->
        <div class="flex justify-between items-center mb-4 relative z-10">
            <div class="flex items-center gap-2.5">
                <svg class="w-9 h-9 rounded-xl shadow-lg shadow-purple-500/30" viewBox="0 0 512 512">
                    <rect width="512" height="512" rx="115" fill="#13112b"/>
                    <polygon points="256,115 370,180 256,245 142,180" fill="#a855f7"/>
                    <polygon points="142,180 256,245 256,375 142,310" fill="#6366f1"/>
                    <polygon points="370,180 256,245 256,375 370,310" fill="#06b6d4"/>
                    <rect x="224" y="230" width="12" height="52" rx="6" fill="#ffffff"/>
                    <rect x="250" y="210" width="12" height="92" rx="6" fill="#ffffff"/>
                    <rect x="276" y="238" width="12" height="40" rx="6" fill="#ffffff"/>
                </svg>
                <div>
                    <span class="font-extrabold text-lg tracking-wide bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-cyan-300 block leading-none">3D Music</span>
                    <span class="text-[10px] text-zinc-400 tracking-wider">ONLINE • AD-FREE</span>
                </div>
            </div>
            <label class="cursor-pointer text-[11px] bg-white/10 hover:bg-white/20 text-zinc-200 border border-white/15 px-2.5 py-1.5 rounded-xl transition flex items-center gap-1.5">
                <i class="fa-solid fa-folder-open text-cyan-400"></i> Local MP3
                <input type="file" id="fileInput" accept="audio/*" multiple class="hidden" onchange="handleFiles(this.files)">
            </label>
        </div>

        <!-- Online Search Bar -->
        <div class="relative z-10 mb-3">
            <div class="flex gap-2">
                <div class="relative flex-1">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-xs"></i>
                    <input type="text" id="searchInput" placeholder="गाना, सिंगर या मूड खोजें (जैसे Kishore, Arijit)..." 
                        onkeydown="if(event.key==='Enter') searchOnlineMusic()"
                        class="w-full bg-white/10 border border-white/15 rounded-2xl pl-9 pr-3 py-2.5 text-xs text-white placeholder-zinc-400 focus:outline-none focus:border-purple-500 transition">
                </div>
                <button onclick="searchOnlineMusic()" class="bg-gradient-to-r from-purple-600 to-cyan-500 px-4 rounded-2xl text-xs font-bold shadow-lg shadow-purple-600/30 active:scale-95 transition">
                    खोजें
                </button>
            </div>

            <!-- Quick Mood / Genre Chips -->
            <div class="flex gap-1.5 overflow-x-auto no-scrollbar mt-2.5 pb-1">
                <button onclick="quickSearch('Bollywood Hit Songs')" class="shrink-0 text-[11px] px-3 py-1 rounded-full bg-white/10 hover:bg-purple-600/40 border border-white/10 transition">🔥 Bollywood</button>
                <button onclick="quickSearch('Kishore Kumar Classic')" class="shrink-0 text-[11px] px-3 py-1 rounded-full bg-white/10 hover:bg-purple-600/40 border border-white/10 transition">📻 Retro Hindi</button>
                <button onclick="quickSearch('Arijit Singh Romantic')" class="shrink-0 text-[11px] px-3 py-1 rounded-full bg-white/10 hover:bg-purple-600/40 border border-white/10 transition">❤️ Romantic</button>
                <button onclick="quickSearch('Hindi Lofi Chill')" class="shrink-0 text-[11px] px-3 py-1 rounded-full bg-white/10 hover:bg-purple-600/40 border border-white/10 transition">🎧 Lo-Fi</button>
                <button onclick="quickSearch('Punjabi Hits')" class="shrink-0 text-[11px] px-3 py-1 rounded-full bg-white/10 hover:bg-purple-600/40 border border-white/10 transition">⚡ Punjabi</button>
                <button onclick="quickSearch('Bhojpuri Hit Songs')" class="shrink-0 text-[11px] px-3 py-1 rounded-full bg-white/10 hover:bg-purple-600/40 border border-white/10 transition">🎶 Bhojpuri</button>
            </div>
        </div>

        <!-- 3D Disc & Visualizer Area -->
        <div class="relative flex flex-col items-center justify-center my-2 disc-container z-10" id="tiltArea">
            <canvas id="visualizer" width="230" height="230" class="absolute pointer-events-none opacity-85"></canvas>
            
            <div id="discWrapper" class="vinyl-disc w-36 h-36 rounded-full p-1.5 bg-gradient-to-tr from-purple-500 via-pink-500 to-cyan-400 shadow-2xl shadow-purple-900/50 relative flex items-center justify-center">
                <div id="discSpin" class="w-full h-full rounded-full bg-zinc-900 flex items-center justify-center relative overflow-hidden spinning paused">
                    <img id="albumArt" src="" alt="" class="w-full h-full object-cover hidden opacity-85">
                    <div class="absolute inset-2 rounded-full border border-white/15"></div>
                    <div class="absolute inset-6 rounded-full border border-white/15"></div>
                    <div class="w-12 h-12 rounded-full bg-zinc-950/90 flex items-center justify-center border-2 border-purple-400/60 z-10 shadow-inner">
                        <svg class="w-7 h-7" viewBox="0 0 512 512">
                            <polygon points="256,115 370,180 256,245 142,180" fill="#a855f7"/>
                            <polygon points="142,180 256,245 256,375 142,310" fill="#6366f1"/>
                            <polygon points="370,180 256,245 256,375 370,310" fill="#06b6d4"/>
                            <rect x="224" y="230" width="12" height="52" rx="6" fill="#ffffff"/>
                            <rect x="250" y="210" width="12" height="92" rx="6" fill="#ffffff"/>
                            <rect x="276" y="238" width="12" height="40" rx="6" fill="#ffffff"/>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Song Info -->
        <div class="text-center mt-2 mb-3 relative z-10">
            <h2 id="songTitle" class="text-base font-bold truncate px-2">ऑनलाइन गाना खोजें या नीचे से चुनें</h2>
            <p id="songArtist" class="text-[11px] text-zinc-400 mt-0.5">3D Spatial Audio Engine</p>
        </div>

        <!-- Progress Bar -->
        <div class="mb-3.5 relative z-10">
            <input type="range" id="progressBar" value="0" min="0" max="100" class="w-full cursor-pointer">
            <div class="flex justify-between text-[10px] text-zinc-400 mt-1 font-mono">
                <span id="currentTime">0:00</span>
                <span id="durationTime">0:00</span>
            </div>
        </div>

        <!-- 3D & Bass Controls -->
        <div class="grid grid-cols-2 gap-2.5 mb-4 relative z-10">
            <button id="btn3D" onclick="toggle3D()" class="py-2 px-3 rounded-2xl border border-white/10 bg-white/5 text-xs font-semibold flex items-center justify-center gap-2 transition-all hover:bg-white/10">
                <i class="fa-solid fa-vr-cardboard text-purple-400"></i>
                <span>3D Audio: <b id="status3D">OFF</b></span>
            </button>
            <button id="btnBass" onclick="toggleBass()" class="py-2 px-3 rounded-2xl border border-white/10 bg-white/5 text-xs font-semibold flex items-center justify-center gap-2 transition-all hover:bg-white/10">
                <i class="fa-solid fa-wave-square text-cyan-400"></i>
                <span>Bass Boost: <b id="statusBass">OFF</b></span>
            </button>
        </div>

        <!-- Main Playback Controls -->
        <div class="flex items-center justify-center gap-6 mb-4 relative z-10">
            <button onclick="prevTrack()" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/15 flex items-center justify-center text-zinc-300 transition">
                <i class="fa-solid fa-backward-step"></i>
            </button>
            <button id="playPauseBtn" onclick="togglePlay()" class="w-14 h-14 rounded-full bg-gradient-to-tr from-purple-600 to-cyan-500 text-white text-lg flex items-center justify-center shadow-lg shadow-purple-600/40 hover:scale-105 active:scale-95 transition">
                <i id="playIcon" class="fa-solid fa-play ml-1"></i>
            </button>
            <button onclick="nextTrack()" class="w-10 h-10 rounded-full bg-white/5 hover:bg-white/15 flex items-center justify-center text-zinc-300 transition">
                <i class="fa-solid fa-forward-step"></i>
            </button>
        </div>

        <!-- Online Results / Playlist -->
        <div class="border-t border-white/10 pt-3 relative z-10">
            <div class="flex justify-between items-center mb-2">
                <span id="listHeader" class="text-[11px] font-semibold text-zinc-300 uppercase tracking-wider">ट्रेंडिंग और प्लेलिस्ट</span>
                <span id="loaderBadge" class="hidden text-[11px] text-purple-400"><i class="fa-solid fa-circle-notch fa-spin mr-1"></i>लोड हो रहा है...</span>
            </div>
            
            <div id="playlist" class="max-h-44 overflow-y-auto space-y-1.5 pr-1 text-sm"></div>
        </div>
    </div>

    <audio id="audioPlayer" crossorigin="anonymous"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');
        const discSpin = document.getElementById('discSpin');
        const albumArt = document.getElementById('albumArt');
        const progressBar = document.getElementById('progressBar');
        const playlistEl = document.getElementById('playlist');
        const loaderBadge = document.getElementById('loaderBadge');
        
        let tracks = [];
        let currentIndex = 0;

        let audioCtx, source, panner, bassFilter, analyser;
        let is3DActive = false;
        let isBassActive = false;
        let panAngle = 0;

        function initAudioContext() {
            if (audioCtx) return;
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();
                source = audioCtx.createMediaElementSource(audio);
                panner = audioCtx.createStereoPanner();
                bassFilter = audioCtx.createBiquadFilter();
                bassFilter.type = "lowshelf";
                bassFilter.frequency.value = 150;
                bassFilter.gain.value = 0;
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 64;

                source.connect(bassFilter);
                bassFilter.connect(panner);
                panner.connect(analyser);
                analyser.connect(audioCtx.destination);
                animate3DAndVisualizer();
            } catch (e) {
                console.log("WebAudio fallback:", e);
            }
        }

        function decodeHtml(html) {
            const txt = document.createElement("textarea");
            txt.innerHTML = html;
            return txt.value;
        }

        function quickSearch(query) {
            document.getElementById('searchInput').value = query;
            searchOnlineMusic();
        }

        // Search Online Music via Open Saavn API + Audius Fallback
        async function searchOnlineMusic() {
            const query = document.getElementById('searchInput').value.trim() || "Bollywood Hit Songs";
            loaderBadge.classList.remove('hidden');
            document.getElementById('listHeader').innerText = `परिणाम: "${query}"`;

            try {
                // Primary: Free Saavn Open API (Hindi, Bollywood, Classic, Regional, English)
                const res = await fetch(`https://saavn.dev/api/search/songs?query=${encodeURIComponent(query)}&limit=15`);
                const data = await res.json();

                if (data && data.data && data.data.results && data.data.results.length > 0) {
                    tracks = data.data.results.map(song => {
                        const urls = song.downloadUrl || [];
                        const bestAudio = urls[urls.length - 1]?.url || urls[0]?.url || "";
                        const images = song.image || [];
                        const bestImg = images[images.length - 1]?.url || "";
                        const artistNames = song.artists?.primary?.map(a => a.name).join(", ") || "Online Artist";
                        return {
                            name: decodeHtml(song.name || "Unknown Track"),
                            artist: decodeHtml(artistNames),
                            url: bestAudio,
                            image: bestImg
                        };
                    }).filter(t => t.url);

                    currentIndex = 0;
                    renderPlaylist();
                    loaderBadge.classList.add('hidden');
                    return;
                }
            } catch (err) {
                console.log("Primary API busy, switching to Audius...");
            }

            // Fallback: Audius Open Music Platform API
            try {
                const audiusRes = await fetch(`https://discoveryprovider.audius.co/v1/tracks/search?query=${encodeURIComponent(query)}&app_name=3DMusicApp`);
                const audiusData = await audiusRes.json();
                if (audiusData && audiusData.data) {
                    tracks = audiusData.data.slice(0, 15).map(item => ({
                        name: item.title,
                        artist: item.user?.name || "Audius Artist",
                        url: `https://discoveryprovider.audius.co/v1/tracks/${item.id}/stream?app_name=3DMusicApp`,
                        image: item.artwork ? item.artwork['480x480'] : ""
                    }));
                    currentIndex = 0;
                    renderPlaylist();
                }
            } catch (e) {
                console.log("Fallback error:", e);
            }
            loaderBadge.classList.add('hidden');
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            if (!tracks.length) {
                playlistEl.innerHTML = `<div class="text-center text-xs text-zinc-400 py-4">कोई गाना नहीं मिला, दूसरा नाम सर्च करें।</div>`;
                return;
            }
            tracks.forEach((track, idx) => {
                const active = idx === currentIndex && audio.src;
                const div = document.createElement('div');
                div.className = `p-2 rounded-xl flex items-center justify-between cursor-pointer transition ${active ? 'bg-purple-600/30 border border-purple-500/40 text-white' : 'bg-white/5 hover:bg-white/10 text-zinc-300'}`;
                div.onclick = () => loadAndPlay(idx);
                div.innerHTML = `
                    <div class="flex items-center gap-2.5 truncate pr-2">
                        ${track.image 
                            ? `<img src="${track.image}" class="w-9 h-9 rounded-lg object-cover shrink-0 bg-zinc-800">`
                            : `<div class="w-9 h-9 rounded-lg bg-purple-600/30 flex items-center justify-center shrink-0"><i class="fa-solid fa-music text-xs text-purple-300"></i></div>`
                        }
                        <div class="truncate">
                            <div class="font-medium text-xs truncate">${track.name}</div>
                            <div class="text-[10px] text-zinc-400 truncate">${track.artist}</div>
                        </div>
                    </div>
                    <i class="fa-solid ${active && !audio.paused ? 'fa-volume-high text-purple-400' : 'fa-play text-xs opacity-60'} shrink-0 mr-1"></i>
                `;
                playlistEl.appendChild(div);
            });
        }

        function loadAndPlay(index) {
            if (!tracks[index]) return;
            initAudioContext();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            currentIndex = index;
            const track = tracks[currentIndex];
            audio.src = track.url;
            document.getElementById('songTitle').innerText = track.name;
            document.getElementById('songArtist').innerText = track.artist;
