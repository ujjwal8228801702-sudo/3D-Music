<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#09090b"><title>3D Music • Ujjwal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap');
*{box-sizing:border-box}body{font-family:Outfit,sans-serif;background:radial-gradient(circle at 10% 0,#26134b,#09090b 58%,#10202c);color:white;min-height:100vh}
.glass{background:#ffffff0d;backdrop-filter:blur(22px);border:1px solid #ffffff1c;box-shadow:0 25px 60px #0009}
@keyframes spin{to{transform:rotate(360deg)}}.spinning{animation:spin 10s linear infinite}.paused{animation-play-state:paused}
input[type=range]{accent-color:#a855f7}.song{display:flex;align-items:center;gap:10px;padding:9px;border:1px solid #ffffff12;border-radius:13px;background:#ffffff08;text-align:left;width:100%}.song:active{background:#8b5cf633}
.song img{width:43px;height:43px;border-radius:9px;object-fit:cover}.muted{color:#a1a1aa}
</style></head>
<body class="flex justify-center p-3 sm:p-5">
<main class="glass w-full max-w-md rounded-3xl p-5 relative overflow-hidden my-auto">
<div class="absolute -top-20 -left-20 w-48 h-48 bg-purple-600/30 rounded-full blur-3xl pointer-events-none"></div>
<header class="flex items-center justify-between mb-5 relative z-10">
<div class="flex items-center gap-3"><div class="w-11 h-11 rounded-xl bg-gradient-to-br from-purple-500 via-indigo-500 to-cyan-400 flex items-center justify-center text-xl shadow-lg"><i class="fa-solid fa-compact-disc"></i></div><div><b class="text-xl font-extrabold">3D Music</b><div class="text-[10px] tracking-widest text-zinc-400">SPATIAL AUDIO PLAYER</div></div></div>
<label class="text-xs bg-white/10 border border-white/15 px-3 py-2 rounded-xl cursor-pointer"><i class="fa-solid fa-folder-open text-cyan-300 mr-1"></i> MP3<input id="fileInput" type="file" accept="audio/*" multiple hidden></label>
</header>
<section class="relative z-10 mb-4">
<div class="flex gap-2"><input id="searchInput" class="min-w-0 flex-1 bg-white/10 border border-white/15 rounded-xl px-3 py-3 text-sm outline-none focus:border-purple-400" placeholder="गाना या Singer खोजें..." autocomplete="off"><button id="searchBtn" class="bg-gradient-to-r from-purple-600 to-cyan-500 rounded-xl px-4 text-sm font-bold">खोजें</button></div>
<div class="flex gap-2 overflow-x-auto mt-3 pb-1 text-xs">
<button class="mood bg-white/10 rounded-full px-3 py-1.5 whitespace-nowrap" data-q="Arijit Singh">❤️ Arijit</button><button class="mood bg-white/10 rounded-full px-3 py-1.5 whitespace-nowrap" data-q="Kishore Kumar">📻 Retro</button><button class="mood bg-white/10 rounded-full px-3 py-1.5 whitespace-nowrap" data-q="Bollywood hits">🔥 Bollywood</button><button class="mood bg-white/10 rounded-full px-3 py-1.5 whitespace-nowrap" data-q="Bhojpuri songs">🎶 Bhojpuri</button><button class="mood bg-white/10 rounded-full px-3 py-1.5 whitespace-nowrap" data-q="Punjabi hits">⚡ Punjabi</button>
</div><p id="status" class="text-xs text-cyan-200 mt-2" role="status">गाना खोजने के लिए नाम लिखें।</p>
</section>
<section class="relative z-10 flex flex-col items-center py-3">
<canvas id="visualizer" width="260" height="150" class="absolute top-0 opacity-70 pointer-events-none"></canvas>
<div id="disc" class="w-40 h-40 rounded-full p-2 bg-gradient-to-tr from-purple-500 via-pink-500 to-cyan-400 shadow-2xl relative">
<div class="w-full h-full rounded-full bg-zinc-950 flex items-center justify-center overflow-hidden relative"><img id="art" class="absolute inset-0 w-full h-full object-cover hidden opacity-80" alt="Album art"><div class="absolute inset-3 rounded-full border border-white/20"></div><div class="w-12 h-12 rounded-full bg-zinc-950 border-2 border-purple-400 flex items-center justify-center z-10"><i class="fa-solid fa-music text-purple-300"></i></div></div></div>
<h2 id="title" class="font-bold text-center mt-4 text-base">3D Music Player</h2><p id="artist" class="text-xs text-zinc-400 mt-1">JioSaavn • Audius • Local MP3</p>
</section>
<section class="relative z-10 mt-3"><input id="seek" type="range" min="0" max="100" value="0" class="w-full"><div class="flex justify-between text-[10px] text-zinc-400"><span id="elapsed">0:00</span><span id="duration">0:00</span></div></section>
<section class="relative z-10 flex items-center justify-center gap-7 my-4"><button id="prev" class="text-xl text-zinc-300"><i class="fa-solid fa-backward-step"></i></button><button id="play" class="w-14 h-14 rounded-full bg-gradient-to-tr from-purple-600 to-cyan-500 text-xl shadow-xl"><i id="playIcon" class="fa-solid fa-play"></i></button><button id="next" class="text-xl text-zinc-300"><i class="fa-solid fa-forward-step"></i></button></section>
<section class="relative z-10 grid grid-cols-2 gap-2 mb-4"><button id="spatial" class="bg-white/10 rounded-xl p-3 text-xs border border-white/10">🌀 3D Audio: OFF</button><button id="bass" class="bg-white/10 rounded-xl p-3 text-xs border border-white/10">🔊 Bass Boost: OFF</button></section>
<section class="relative z-10 border-t border-white/10 pt-3"><div class="flex justify-between items-center mb-2"><b id="listTitle" class="text-xs tracking-wider text-zinc-300">SEARCH RESULTS</b><span class="text-[10px] text-zinc-500">JioSaavn + Audius</span></div><div class="flex gap-2 mb-3"><button id="showSearch" class="flex-1 bg-purple-500/20 border border-purple-400/30 rounded-lg py-2 text-xs">🔎 Search</button><button id="showFav" class="flex-1 bg-white/10 rounded-lg py-2 text-xs">❤️ पसंदीदा</button><button id="showPlaylist" class="flex-1 bg-white/10 rounded-lg py-2 text-xs">📃 Playlist</button></div><div id="results" class="space-y-2 max-h-64 overflow-y-auto"><p class="text-xs text-zinc-500 text-center py-4">Search results यहाँ दिखेंगे।</p></div></section>
<p class="text-[10px] text-zinc-500 text-center mt-4">Streams depend on source availability and each track’s usage rights.</p>
</main>
<audio id="audio" crossorigin="anonymous"></audio>
<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const audio=$('audio'),results=$('results'),status=$('status'),seek=$('seek');
let tracks=[],index=-1,localUrls=[],audioCtx,source,analyser,bassFilter,panner,is3D=false,isBass=false,viewMode='search';\nconst loadSaved=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(_){return []}};\nlet favorites=loadSaved('ujjwal3d_favorites'),playlist=loadSaved('ujjwal3d_playlist');\nfunction saveSaved(){try{localStorage.setItem('ujjwal3d_favorites',JSON.stringify(favorites));localStorage.setItem('ujjwal3d_playlist',JSON.stringify(playlist))}catch(e){say('फोन में storage भर गया है।')}}\nfunction sameTrack(a,b){return a&&b&&a.trackName===b.trackName&&a.artistName===b.artistName&&a.previewUrl===b.previewUrl}\nfunction toggleFavorite(t){const n=favorites.findIndex(x=>sameTrack(x,t));if(n>=0)favorites.splice(n,1);else favorites.push(t);saveSaved();render();say(n>=0?'पसंदीदा से हटाया गया।':'❤️ पसंदीदा में सेव हुआ।')}\nfunction addPlaylist(t){if(!playlist.some(x=>sameTrack(x,t))){playlist.push(t);saveSaved();say('गाना आपकी Playlist में जुड़ गया।')}else say('यह गाना पहले से Playlist में है।');if(viewMode!=='search')render()}\nfunction showLibrary(mode){viewMode=mode;tracks=mode==='favorites'?favorites.slice():mode==='playlist'?playlist.slice():tracks;$('listTitle').textContent=mode==='favorites'?'❤️ FAVORITES ('+tracks.length+')':mode==='playlist'?'📃 MY PLAYLIST ('+tracks.length+')':'SEARCH RESULTS';render();say(mode==='favorites'?'आपके पसंदीदा गाने।':mode==='playlist'?'आपकी सेव की हुई Playlist।':'Search results');}
function say(t){status.textContent=t}
function time(v){if(!Number.isFinite(v))return '0:00';return Math.floor(v/60)+':'+String(Math.floor(v%60)).padStart(2,'0')}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function searchOnlineMusic(query){
 const q=(query||$('searchInput').value).trim();if(!q){say('पहले गाने या Singer का नाम लिखें।');$('searchInput').focus();return}
 $('searchInput').value=q;$('searchBtn').disabled=true;$('searchBtn').textContent='...';say('JioSaavn पर खोज रहे हैं...');results.innerHTML='<p class="text-xs text-center text-zinc-400 py-4">JioSaavn खोज रहा है...</p>';
 tracks=[];let primaryError=null;
 try{
  const u='https://saavn.dev/api/search/songs?query='+encodeURIComponent(q);
  const r=await fetch(u,{method:'GET',headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('JioSaavn HTTP '+r.status);
  const j=await r.json();const rows=j?.data?.results||j?.data?.songs?.results||[];
  tracks=rows.map(s=>{
   const links=Array.isArray(s.downloadUrl)?s.downloadUrl:[];
   const audioLink=(links.find(x=>String(x.quality||'').includes('320'))||links[links.length-1]||{}).url||s.url||'';
   const imgs=Array.isArray(s.image)?s.image:[];
   const cover=(imgs.find(x=>String(x.quality||'').includes('500'))||imgs[imgs.length-1]||{}).url||'';
   const artists=s.artists?.primary?.map(a=>a.name).filter(Boolean).join(', ')||s.primaryArtists||s.artist||'JioSaavn';
   return {trackName:s.name||s.title||'Unknown',artistName:artists,collectionName:s.album?.name||s.album||'',artworkUrl100:cover,previewUrl:audioLink,provider:'JioSaavn'};
  }).filter(t=>t.previewUrl);
  if(tracks.length){$('listTitle').textContent='JIOSAAVN RESULTS ('+tracks.length+')';render();say(tracks.length+' गाने JioSaavn पर मिले।');return}
  throw new Error('JioSaavn पर playable results नहीं मिले');
 }catch(e){primaryError=e;console.warn('JioSaavn unavailable:',e)}
 try{
  say('JioSaavn उपलब्ध नहीं है — Audius backup खोज रहे हैं...');
  const u='https://discoveryprovider.audius.co/v1/tracks/search?query='+encodeURIComponent(q)+'&limit=20';
  const r=await fetch(u,{headers:{'Accept':'application/json'}});
  if(!r.ok)throw new Error('Audius HTTP '+r.status);
  const j=await r.json();const rows=j?.data||[];
  tracks=rows.filter(s=>s.id&&s.is_streamable!==false).map(s=>({
   trackName:s.title||'Unknown',artistName:s.user?.name||'Audius artist',
   collectionName:s.genre||'Audius',artworkUrl100:s.artwork?.['150x150']||s.artwork?.['480x480']||'',
   previewUrl:'https://discoveryprovider.audius.co/v1/tracks/'+encodeURIComponent(s.id)+'/stream',
   provider:'Audius'
  }));
  if(!tracks.length)throw new Error('Audius पर भी गाने नहीं मिले');
  $('listTitle').textContent='AUDIUS BACKUP ('+tracks.length+')';render();say('JioSaavn नहीं मिला। Audius backup से '+tracks.length+' गाने मिले।');
 }catch(e){
  console.error('Both music sources failed',primaryError,e);
  results.innerHTML='<p class="text-xs text-center text-rose-300 py-4">JioSaavn और Audius दोनों से खोज नहीं हो पाई। Internet या API server की उपलब्धता जाँचें।</p>';
  say('दोनों music servers से कनेक्शन नहीं हुआ।');
 }
 finally{$('searchBtn').disabled=false;$('searchBtn').textContent='खोजें'}
}
function render(){results.innerHTML='';tracks.forEach((t,i)=>{const b=document.createElement('div');b.className='song';b.innerHTML='<img src="'+esc(t.artworkUrl100||'')+'" alt=""><span class="min-w-0 flex-1"><b class="block text-xs truncate">'+esc(t.trackName)+'</b><small class="block text-[10px] text-zinc-400 truncate">'+esc(t.artistName)+' • '+esc(t.collectionName||'')+'</small></span><button class="playOne text-purple-300 text-xs px-2" aria-label="Play"><i class="fa-solid fa-play"></i></button><button class="favOne text-pink-300 text-sm px-1" aria-label="Favorite">'+(favorites.some(x=>sameTrack(x,t))?'♥':'♡')+'</button><button class="addOne text-cyan-300 text-xs px-1" aria-label="Add to playlist">＋</button>';b.querySelector('.playOne').addEventListener('click',()=>playTrack(i));b.querySelector('.favOne').addEventListener('click',()=>toggleFavorite(t));b.querySelector('.addOne').addEventListener('click',()=>addPlaylist(t));results.appendChild(b)})}
function initAudio(){if(audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC){say('इस browser में Audio Effects supported नहीं हैं।');return}audioCtx=new AC();source=audioCtx.createMediaElementSource(audio);bassFilter=audioCtx.createBiquadFilter();bassFilter.type='lowshelf';bassFilter.frequency.value=150;bassFilter.gain.value=0;panner=audioCtx.createStereoPanner();analyser=audioCtx.createAnalyser();analyser.fftSize=128;source.connect(bassFilter);bassFilter.connect(panner);panner.connect(analyser);analyser.connect(audioCtx.destination);drawViz()}
async function playTrack(i){if(i<0||i>=tracks.length)return;index=i;const t=tracks[i];audio.src=t.previewUrl;$('title').textContent=t.trackName||'Unknown';$('artist').textContent=(t.artistName||'')+' • '+(t.provider||'Local MP3');$('art').src=t.artworkUrl100||'';$('art').classList.toggle('hidden',!t.artworkUrl100);$('disc').classList.add('spinning');$('disc').classList.remove('paused');try{initAudio();if(audioCtx&&audioCtx.state==='suspended')await audioCtx.resume();await audio.play();$('playIcon').className='fa-solid fa-pause';say('अब preview चल रहा है।')}catch(e){$('disc').classList.add('paused');say('Playback शुरू नहीं हुआ: '+e.message)}}
async function togglePlay(){if(!audio.src){if(tracks.length)playTrack(0);else say('पहले ऑनलाइन गाना खोजें या MP3 चुनें।');return}if(audio.paused){try{initAudio();if(audioCtx&&audioCtx.state==='suspended')await audioCtx.resume();await audio.play()}catch(e){say('Play error: '+e.message)}}else audio.pause()}
function next(){if(tracks.length)playTrack((index+1)%tracks.length)}
function prev(){if(tracks.length)playTrack((index-1+tracks.length)%tracks.length)}
$('showSearch').addEventListener('click',()=>{viewMode='search';$('listTitle').textContent='SEARCH RESULTS';say('गाना खोजने के लिए ऊपर नाम लिखें।')});$('showFav').addEventListener('click',()=>showLibrary('favorites'));$('showPlaylist').addEventListener('click',()=>showLibrary('playlist'));\n$('searchBtn').addEventListener('click',()=>{viewMode='search';searchOnlineMusic()});$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter'){viewMode='search';searchOnlineMusic()}});
document.querySelectorAll('.mood').forEach(b=>b.addEventListener('click',()=>{viewMode='search';searchOnlineMusic(b.dataset.q)}));
$('play').addEventListener('click',togglePlay);$('next').addEventListener('click',next);$('prev').addEventListener('click',prev);
audio.addEventListener('play',()=>{$('playIcon').className='fa-solid fa-pause';$('disc').classList.remove('paused')});
audio.addEventListener('pause',()=>{$('playIcon').className='fa-solid fa-play';$('disc').classList.add('paused')});
audio.addEventListener('ended',next);audio.addEventListener('timeupdate',()=>{if(Number.isFinite(audio.duration)){seek.value=audio.currentTime/audio.duration*100;$('elapsed').textContent=time(audio.currentTime);$('duration').textContent=time(audio.duration)}});
seek.addEventListener('input',()=>{if(Number.isFinite(audio.duration))audio.currentTime=(seek.value/100)*audio.duration});
$('spatial').addEventListener('click',()=>{initAudio();is3D=!is3D;if(panner)panner.pan.value=is3D?Math.sin(Date.now()/500):0;$('spatial').textContent='🌀 3D Audio: '+(is3D?'ON':'OFF');$('spatial').classList.toggle('border-purple-400',is3D);if(is3D)orbitPan()});
function orbitPan(){if(!is3D||!panner)return;panner.pan.setTargetAtTime(Math.sin(Date.now()/900),audioCtx.currentTime,.15);requestAnimationFrame(orbitPan)}
$('bass').addEventListener('click',()=>{initAudio();isBass=!isBass;if(bassFilter)bassFilter.gain.setTargetAtTime(isBass?10:0,audioCtx.currentTime,.08);$('bass').textContent='🔊 Bass Boost: '+(isBass?'ON':'OFF');$('bass').classList.toggle('border-cyan-400',isBass)});
$('fileInput').addEventListener('change',e=>{const files=Array.from(e.target.files||[]);if(!files.length)return;localUrls.forEach(URL.revokeObjectURL);localUrls=[];tracks=files.map(f=>{const u=URL.createObjectURL(f);localUrls.push(u);return{trackName:f.name.replace(/\.[^.]+$/,''),artistName:'आपकी MP3 फाइल',previewUrl:u,artworkUrl100:''}});index=-1;render();$('listTitle').textContent='YOUR LOCAL MP3 ('+tracks.length+')';say(files.length+' MP3 फाइलें लोड हुईं।');playTrack(0)});
function drawViz(){const c=$('visualizer'),ctx=c.getContext('2d'),data=new Uint8Array(analyser.frequencyBinCount);function frame(){requestAnimationFrame(frame);analyser.getByteFrequencyData(data);ctx.clearRect(0,0,c.width,c.height);const w=c.width/data.length;for(let i=0;i<data.length;i++){const h=data[i]/255*55;ctx.fillStyle='rgba(168,85,247,'+(0.25+data[i]/500)+')';ctx.fillRect(i*w,c.height/2-h/2,Math.max(2,w-2),h)}}frame()}
window.addEventListener('beforeunload',()=>localUrls.forEach(URL.revokeObjectURL));
})();
</script></body></html>
